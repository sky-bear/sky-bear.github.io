<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG</title>
  </head>
  <body>
    <svg width="400" height="400" style="border: 1px solid #000000">
      <circle
        cx="200"
        cy="200"
        r="50"
        stroke="black"
        stroke-width="3"
        fill="red"
      />
      <rect
        x="50"
        y="50"
        width="100"
        height="100"
        stroke="blue"
        stroke-width="3"
        fill="green"
      />
      <line x1="0" y1="0" x2="400" y2="400" stroke="purple" stroke-width="2" />
      <text x="150" y="30" font-family="Arial" font-size="24" fill="black">
        Hello SVG
      </text>
    </svg>
  </body>
</html>
