<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="outer">
      <div id="middle">
        <div id="inner">点我</div>
      </div>
      
    </div>
    </div>
    <script>
      const $inner = document.querySelector("#inner");
      const $middle = document.querySelector("#middle");
      const $outer = document.querySelector("#outer");

      function handler() {
        console.log("click"); // 直接输出

        Promise.resolve().then((_) => console.log("promise")); // 注册微任务

        setTimeout(() => console.log("timeout")); // 注册宏任务

        requestAnimationFrame((_) => console.log("animationFrame")); // 注册宏任务

        $outer.setAttribute("data-random", Math.random()); // DOM属性修改，触发微任务
      }

      function handler1() {
        console.log("click-out"); // 直接输出

        Promise.resolve().then((_) => console.log("promise-out")); // 注册微任务

        setTimeout(() => console.log("timeout-out")); // 注册宏任务

        requestAnimationFrame((_) => console.log("animationFrame-out")); // 注册宏任务

        $outer.setAttribute("data-random", Math.random()); // DOM属性修改，触发微任务
      }
      function handler2() {
        console.log("click-middle"); // 直接输出

        Promise.resolve().then((_) => console.log("promise-middle")); // 注册微任务

        setTimeout(() => console.log("timeout-middle")); // 注册宏任务

        requestAnimationFrame((_) => console.log("animationFrame-middle")); // 注册宏任务

        $outer.setAttribute("data-random", Math.random()); // DOM属性修改，触发微任务
      }

      new MutationObserver((_) => {
        console.log("observer");
      }).observe($outer, {
        attributes: true,
      });

      $inner.addEventListener("click", handler);
      $middle.addEventListener("click", handler2);
      $outer.addEventListener("click", handler1);
      // click
      // promise
      // observer
      // click-out
      // promise-out
      // observer
      // animationFrame
      // animationFrame-out
      // timeout
      // timeout-out
    </script>
  </body>
</html>
