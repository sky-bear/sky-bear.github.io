      ];

      const loadImg = (url) => {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.src = url;
          img.onload = () => {
            resolve(img);
          };
          img.onerror = () => {
            reject(new Error(`load ${url} fail`));
          };
        });
      };

      class ConcurrentLimiter {
        constructor(limit) {
          this.limit = limit;
          this.queue = [];
          this.activeCount = 0;
        }
        enqueue(fn) {
          return new Promise((resolve, reject) => {
            this.queue.push(() => {
              fn()
                .then(resolve)
                .catch(reject)
                .finally(() => {
                  this.activeCount--;
                  this.dequeue();
                });
            });
            this.dequeue();
          });
        }
        dequeue() {
          if (this.activeCount < this.limit && this.queue.length > 0) {
            this.activeCount++;
            this.queue.shift()();
          }
        }
      }

      const concurrentLimiter = new ConcurrentLimiter(3);
      urls.forEach((img) => {
        concurrentLimiter.enqueue(() => loadImg(img));
      });
