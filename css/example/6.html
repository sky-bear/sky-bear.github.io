    <style>
      /* div {

    } */
      .demo1 {
        width: 0;
        height: 0;

        width: 8px;
        height: 0;

      }

        margin-top: 20px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        /* border: 1px solid red; */
        overflow: hidden;
      }
      .demo3 div {
        width: 0;
        height: 0;
        border: 10px solid transparent;
        border-top-color: pink;
      }
    </style>
  </head>

  <body>
    <div class="box">
      <div class="demo1"></div>
      <div class="demo2"></div>
      <div class="demo3">
