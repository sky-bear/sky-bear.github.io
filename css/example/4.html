<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>浮动</title>
    <style>
      .father {
        width: 200px;
        border: 2px solid red;
      }
      .child {
        width: 50px;
        height: 50px;
        border: 2px solid blue;
      }
      .child:nth-of-type(3) {
        float: right;
      }
      .clear {
        clear: both;
      }
      .clearfix::after {
        content: "";
        display: table;
        clear: both;
      }
      .father2 {
        width: 200px;
        border: 2px solid red;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <div class="father">
      <div class="child">1</div>
      <div class="child">2</div>
      <div class="child">3</div>
      <div class="clear"></div>
    </div>
    <div class="father clearfix">
      <div class="child">4</div>
      <div class="child">5</div>
      <div class="child">6</div>
    </div>
    <div class="father2">
      <div class="child">4</div>
      <div class="child">5</div>
      <div class="child">6</div>
    </div>
  </body>
</html>
