<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>元素的显示隐藏</title>
  <style>
    .box {
      width: 200px;
      height: 200px;
      background-color: red;
      margin-bottom: 20px;
      margin-right: 20px;
    }
    .box1 {
      display: none;
    }
    .box2 {
      opacity: 0;
    }
    .box3 {
      visibility: hidden;
    }
  </style>
</head>
<body>
  <div class="box box1"></div>
  <div class="box box2"></div>
  <div class="box box3"></div>
  <!-- <div class="box"></div> -->
</body>
</html>
