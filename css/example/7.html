<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        width: 200px;
        height: 200px;
        background: red;
        margin-left: 100px;
      }

      .box1 {
        position: absolute;
        visibility: hidden;
        opacity: 0;
        transition: opacity 0.5s linear;
        background: cyan;
        width: 100px;
        height: 100px;
      }
      .box:hover .box1 {
        visibility: visible;
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="box1"></div>
    </div>
  </body>
</html>
